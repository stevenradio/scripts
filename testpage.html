<script>
var SCRIPTS=[{"id": "lecture1", "title": "關於表演", "week": "Week 1 · 4/11", "subtitle": "課堂講義", "type": "lecture", "author": "陳幼芳", "chars": [], "sections": [{"h1": "什麼是表演", "p": ["表演是一種在舞台上或透過鏡頭傳達自然又具有創造力的生活，其目的讓是要觀眾感受到真實的感動。"]}, {"h1": "如何成為一個好的表演者", "items": [{"k": "觀察", "v": "隨時觀察週遭的人、事、物，豐富記憶盒。"}, {"k": "學習", "v": "鍛鍊開發聲音、肢體的可能性。"}, {"k": "培養", "v": "認真的態度、專注力和想像力、創造力。"}, {"k": "把握", "v": "每一次有觀眾的表演，累積經驗。"}, {"k": "檢討", "v": "客觀的檢查每一次的表演。"}]}, {"h1": "聲音練習", "items": [{"k": "腹式呼吸", "v": "呼吸氣囊加大，增加聲音的厚實度以利聲音傳達。"}, {"k": "清楚說話", "v": "咬字、嘴型，讓詞意徹底表達。"}, {"k": "節奏速度", "v": "幫助情緒的變化，增加表演樣貌。"}, {"k": "拉大音域", "v": "擴大聲音表情，增加角色趣味性。"}, {"k": "情緒傳遞", "v": "內在情緒藉著聲音清楚傳達。"}]}, {"h1": "活動肢體練習", "p": ["讓身體接收多種不同的練習，豐富肢體語言讓不同的角色有不同的身體姿態。"]}, {"h1": "即興練習", "p": ["如何在沒有劇本、沒有預設情緒、沒有先行排演的狀況之下，去尋找最直接最自然的反應。", "真正的聆聽，真實的思考，感覺演員之間的互動。"]}]}, {"id": "qiaoqiao", "title": "悄悄佔據你", "week": "Week 2 · 4/18", "subtitle": "特力家居 2012 微電影　第三話＿填滿", "chars": [{"name": "花姐", "role": "主管"}, {"name": "欣潔", "role": "員工"}], "data": [{"t": "l", "c": "花姐", "s": "欣潔阿，還沒走阿？"}, {"t": "s", "s": "花姐轉過頭來看像欣潔（音效）。"}, {"t": "s", "s": "花姐慢慢後退彎下腰。"}, {"t": "l", "c": "花姐", "s": "（大聲）關、欣、潔！"}, {"t": "l", "c": "欣潔", "s": "花姐⋯⋯（淡淡語氣）。"}, {"t": "l", "c": "花姐", "s": "（關心）怎麼啦，無精打采的？"}, {"t": "l", "c": "欣潔", "s": "我⋯⋯。"}, {"t": "l", "c": "花姐", "s": "來，有什麼難言之隱儘管跟花姐說。"}, {"t": "s", "s": "花姐越講越陶醉頭微微上揚，突然留職停薪表入鏡，花姐表情轉為錯愕。"}, {"t": "l", "c": "花姐", "s": "花姐好歹也是過來人，想當年⋯⋯。"}, {"t": "l", "c": "欣潔", "s": "花姐，"}, {"t": "s", "s": "欣潔一手撐頭沒看花姐一手遞出留職停薪表。"}, {"t": "l", "c": "欣潔", "s": "我想要留職停薪一陣子！"}, {"t": "s", "s": "花姐將留職停薪表抽走。"}, {"t": "l", "c": "花姐", "s": "（驚訝）啊？留職停薪？（連珠炮）唉唷，我的姑奶奶，週年慶快到了，妳竟然在這個時候跟我說要請假？還有，下個月，設計講堂的年度活動也要靠你和立銘撐場，妳突然這樣雙手一攤，妳要我怎麼辦？"}, {"t": "s", "s": "欣潔轉過頭面向花姐拉著手臂委屈的訴說，說完又轉回去。"}, {"t": "l", "c": "欣潔", "s": "對不起，花姐，我最近身體不太舒服，我⋯⋯怕會影響工作。"}, {"t": "s", "s": "花姐拉了旁邊的椅子坐下，拿起了申請書、戴起眼鏡、拿起筆，像醫生問診一樣開始問欣潔問題。"}, {"t": "l", "c": "花姐", "s": "咳⋯⋯咳（清喉嚨的聲音），妳最近會不會覺得，有些無力感，工作沒動力呢？"}, {"t": "s", "s": "欣潔對花姐點頭。"}, {"t": "l", "c": "欣潔", "s": "嗯⋯⋯有點！"}, {"t": "l", "c": "花姐", "s": "常常失眠，胸口悶悶的？"}, {"t": "s", "s": "欣潔又點點頭，更驚訝的看著花姐。"}, {"t": "l", "c": "花姐", "s": "有時會頭痛、胃痛、心絞痛、全身無力⋯⋯甚至⋯⋯還有點想哭？"}, {"t": "s", "s": "欣潔張大眼睛更用力的點頭，覺得花姐很厲害。"}, {"t": "s", "s": "花姐露出匪夷所思的笑容。"}, {"t": "l", "c": "花姐", "s": "好吧，我知道了，去放個假、散散心吧，想回來上班再跟我說！"}, {"t": "l", "c": "欣潔", "s": "謝謝妳，花姐⋯⋯我其實⋯⋯。"}, {"t": "l", "c": "花姐", "s": "（慧點的眼神）不必說了，快回去吧，別忘了我是過來人。"}]}, {"id": "biaoqing", "title": "表演課練習（表情）", "week": "Week 6 · 5/16", "subtitle": "表演課練習腳本", "chars": [{"name": "雨晴", "role": "獨白"}], "data": [{"t": "l", "c": "雨晴", "s": "那好吧，就請你看清楚，合約裡寫得清清楚楚，雙方用的印，必須是含有公司註冊號的公司用章，才算正式的合約，這份合約裡公司章，是個廢章，所以這份合約根本不成立，若你真要追究也只能找我們黛黛經理⋯⋯"}, {"t": "l", "c": "雨晴", "s": "對了！我聽說可口可樂好像也是貴公司底下長期配合的廠商，我想應該不會是有人在玩什麼雙面設計的手段吧！如果是這樣我們公司也不同意讓人當棋子要，有必要就走法律嘛，我們公司也要討回一個公道！不知道淇總有甚麼看法？"}]}, {"id": "movie101", "title": "電影演技小教室", "week": "Week 6 · 5/16", "subtitle": "助教課外教學", "chars": [{"name": "A", "role": "角色 A"}, {"name": "B", "role": "角色 B"}], "data": [{"t": "l", "c": "A", "s": "怎樣？"}, {"t": "l", "c": "B", "s": "我真的不知道該說什麼。"}, {"t": "l", "c": "A", "s": "你真的是個演員。"}, {"t": "l", "c": "B", "s": "是嗎？那你呢？你覺得你做了什麼？我去找過爸了，他狀況很差。"}, {"t": "l", "c": "A", "s": "我等等還有事要去開會，我快遲到了。"}, {"t": "l", "c": "B", "s": "你就這樣把他帶走，完全不管我們所有人。"}, {"t": "l", "c": "A", "s": "不然你是想要把他丟在你家嗎？"}, {"t": "l", "c": "B", "s": "那現在他在這裡會怎樣？你覺得接下來會怎麼樣？"}, {"t": "l", "c": "A", "s": "他正在接受治療，現在是最好的醫生在照顧他。"}, {"t": "l", "c": "B", "s": "他會好嗎？你老實說，你覺得他會好嗎？會嗎？"}, {"t": "l", "c": "B", "s": "你們兩個都一樣，我跟笨蛋一樣夾在你們中間。你覺得我都住在鄉下，我不是台北人，不是文明人我不懂，對吧？我真的受不了你，我也受不了他。你他媽每次都想做什麼就做什麼，不管別人死活。"}, {"t": "l", "c": "A", "s": "是你自己想要來這裡的，不要拿我當藉口。"}, {"t": "l", "c": "B", "s": "我不知道欸，我已經不知道我想不想了，我根本沒有時間思考我想不想。太扯了，幹我們不是一家人嗎？我們是一家人，遇到這種事情本來應該要讓我們更團結。"}, {"t": "l", "c": "B", "s": "你吃那什麼？"}, {"t": "l", "c": "A", "s": "鎮定劑。"}, {"t": "l", "c": "B", "s": "阿傑說你是個壞人。"}, {"t": "l", "c": "A", "s": "抱歉噢，雖然他是你先生，但他就是個白目。"}, {"t": "l", "c": "B", "s": "對，他也可能說的很對。"}, {"t": "l", "c": "A", "s": "對，他說的對。"}]}, {"id": "qijie", "title": "七個朋友", "week": "Week 7 · 6/6", "subtitle": "對戲閱讀版", "chars": [{"name": "結人", "role": "買方 / 作家"}, {"name": "葉子", "role": "房仲朋友"}, {"name": "瑪莉", "role": "經紀人"}], "data": [{"t": "l", "c": "結人", "s": "我去找你簽約就可以了，還麻煩妳跑這一趟。"}, {"t": "l", "c": "葉子", "s": "本來，就應該是我主動找你才對，你幹嘛比我還積極…而且，我也想再確認一下，你真的要買回原本你租的那間房子啊？"}, {"t": "l", "c": "結人", "s": "對啊！"}, {"t": "l", "c": "葉子", "s": "那間的屋齡很舊了喔。不再多考慮一下？我上次推薦給你的那間新屋嗎？要買屋的話，還是新房子比較好吧！"}, {"t": "s", "s": "葉子說完，又把手中準備好的新屋資料推給結人看。"}, {"t": "l", "c": "結人", "s": "不用了啦！都住了那麼久，那屋子裝的是我滿滿的回憶，任何新屋都比不上我的那間小狗窩，你自己不是也住過一陣子，應該很清楚吧！"}, {"t": "s", "s": "葉子也認同地點了點頭，但還是善盡朋友的提醒。"}, {"t": "l", "c": "葉子", "s": "不過，買房子這麼大的事，你一定要仔細考慮清楚，千萬不要受我影響。"}, {"t": "l", "c": "結人", "s": "如果你要問我的話，我坦白說，我還蠻喜歡那棟房子的，就跟寫作一樣，我做什麼事都憑感覺，第一眼的感覺最重要！你也知道，我這個人最念舊了。"}, {"t": "s", "s": "瑪莉仔細翻閱合約，提出一連串的質疑。"}, {"t": "l", "c": "瑪莉", "s": "合約上只寫明，房屋主結構體保固十五年，那漏水保固呢？你們保固幾年？另外，凶宅查證保固也要註明上去。萬一、買屋後發現有這些問題，你們得負責賠償我們的損失。"}, {"t": "l", "c": "葉子", "s": "你放心啦！結人是我的好朋友，我不會騙他的啦！更何況，我和結人都住過，保證絕對沒有鬼！憑良心說，除了屋齡有點老以外，屋況維持的都還不錯，而且、我都說不抽佣金了。"}, {"t": "s", "s": "瑪莉懷疑的眼光盯著葉子。"}, {"t": "l", "c": "瑪莉", "s": "不抽更可疑，感覺這房子好像有什麼問題…"}, {"t": "s", "s": "葉子一副受不了的模樣。"}, {"t": "l", "c": "葉子", "s": "厚，你的疑心病真的很重耶！"}, {"t": "l", "c": "瑪莉", "s": "你也知道，我們這位大作家粗心得很，要是沒有我這個經紀人幫他嚴格把關，就怕他會上當受騙！"}, {"t": "l", "c": "葉子", "s": "你在暗示，我這個老朋友會騙他嗎？"}, {"t": "l", "c": "瑪莉", "s": "現在詐騙集團這麼多，這個世界上，什麼不可能發生的事都有可能會發生。"}, {"t": "s", "s": "眼看葉子和瑪莉彼此針鋒相對，都是為了結人在爭執，結人只好跳出來緩頰。"}, {"t": "l", "c": "結人", "s": "你們別這樣嘛！"}, {"t": "s", "s": "結人轉頭對葉子解釋。"}, {"t": "l", "c": "結人", "s": "瑪莉做事一向很仔細、很謹慎，他是對事不對人，絕對不是故意在針對你！"}, {"t": "l", "c": "葉子", "s": "哼！"}, {"t": "s", "s": "結人隨即又轉向瑪莉解釋。"}, {"t": "l", "c": "結人", "s": "葉子說話就是心直口快，雖然不一定中聽，但肯定句句都是實話。"}, {"t": "l", "c": "瑪莉", "s": "你和她倒底是什麼關係？怎麼處處偏袒她？你們兩個是不是有什麼曖昧？為什麼以前住在一起？"}, {"t": "s", "s": "結人一聽，尷尬地結結巴巴…"}, {"t": "l", "c": "結人", "s": "才…才沒有呢！"}, {"t": "l", "c": "瑪莉", "s": "要是有的話，可得先告訴我這個經紀人，假如，以後被媒體踢爆，我也好有個準備。"}, {"t": "s", "s": "結人怕瑪莉和葉子再起衝突，趕緊打發瑪莉。"}, {"t": "l", "c": "結人", "s": "那個…你先幫我影印一下合約，回去再幫我研究看看。"}, {"t": "s", "s": "瑪莉看結人拜託的樣子，只好心不甘情不願地先離開。"}, {"t": "l", "c": "葉子", "s": "我跟他合不來，我看，你換個經紀人吧！不然、就乾脆換掉我這個朋友算了。"}, {"t": "l", "c": "結人", "s": "啊？"}]}, {"id": "fengtan", "title": "翻糖花園", "week": "Week 10 · 6/13", "subtitle": "表演練習", "chars": [{"name": "希煥", "role": "男主角"}, {"name": "美英", "role": "閨蜜"}], "data": [{"t": "l", "c": "希煥", "s": "怎麼是你在做蛋糕？米恩呢？"}, {"t": "l", "c": "美英", "s": "米恩不做蛋糕了。", "note": {"label": "老師筆記", "text": "正在做蛋糕的樣子，但直視前方；回話時暫停手上的動作——讓觀眾感覺她不想看希煥。"}}, {"t": "l", "c": "希煥", "s": "什麼意思？"}, {"t": "l", "c": "美英", "s": "米恩現在連蛋糕都做不出來了！全都是因為你，這明明是她最擅長的事，可是現在因為你整天心不在焉的連蛋糕都做不好！你知道那是什麼心情嗎？"}, {"t": "l", "c": "美英", "s": "（話說從頭）自從米恩答應她爸爸守護這間店以來，從來沒想到要休息，不管遇到什麼挫折也都沒放棄做蛋糕，就連跟顏瀚祥那傢伙分手她都還是堅持下去！", "note": {"label": "老師筆記", "text": "說「話說從頭」時<strong>環顧四周</strong>，像在回憶這個空間。<br><br><strong>「就連」故意說兩次</strong>——重複強調，讓情緒層層疊加。<br><br><strong>抬頭看天花板</strong>，像在回憶米恩的過去，不是對著希煥說，是說給自己聽的感覺。"}}, {"t": "l", "c": "美英", "s": "（越說越激動）可是因為你，她做的蛋糕第一次被客人嫌難吃，因為你，她第一次丟下蛋糕店，因為你，她被迫對不起她爸爸，你怎麼還有臉來找她？", "note": {"label": "老師筆記", "text": "<strong>這一段越來越激動，要用斷句製造爆發感：</strong><br>「可是因為你（呼吸）她做的蛋糕第一次被客人嫌難吃因為你（呼吸）她第一次丟下蛋糕店因為你（呼吸）她被迫對不起她爸爸你怎麼還有臉來找她呀！」<br><br>每一個「因為你」之後都要換氣，像控訴一樣，節奏越來越快越來越緊。"}}, {"t": "l", "c": "希煥", "s": "對不起！"}, {"t": "l", "c": "美英", "s": "（失望）我們大家是那麼的喜歡你信任你……你簡直比顏瀚祥那傢伙還可惡，假裝是我們的朋友，卻笑嘻嘻的背叛我們！（傷心）本來還以為可以把米恩交給你……沒想到你卻……（哽咽說不下去）我廖美英真的是瞎了狗眼看錯了你！（下定決心）這一次我不會再給你機會傷害米恩（冷漠），現在請你離開。", "note": {"label": "老師筆記", "text": "說「假裝是我們的朋友」後<strong>帶一個自嘲的笑</strong>——不是崩潰，是那種咬著牙、帶苦笑的懊悔。<br><br>「我廖美英真的是瞎了狗眼看錯了你」——<strong>結尾拉長：「你——一！」</strong>多一個音，像用力收尾，製造張力與終結感。<br><br><strong>帶咬牙切齒的感覺</strong>，像是在嘲笑自己當初太蠢，情緒是複雜的，不是單純憤怒。"}}]}];
var currentScriptId=localStorage.getItem('last-script')||SCRIPTS[0].id,darkOn=false,hlChars=new Set(),currentMode='read',cueChar='off',rehearseChar='off',fs=parseInt(localStorage.getItem('fs')||'21'),allNotesExpanded=false;
var OPENING_QUOTES=['表演是一種在舞台上或透過鏡頭傳達自然又具有創造力的生活','其目的讓是要觀眾感受到真實的感動','隨時觀察週遭的人、事、物，豐富記憶盒','真正的聆聽，真實的思考，感覺演員之間的互動'];
function esc(s){return String(s||'').replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))}
function dismissOpening(){var el=document.getElementById('opening');if(!el||el.classList.contains('fade-out'))return;el.classList.add('fade-out');setTimeout(()=>{el.style.display='none';localStorage.setItem('opening-ts',Date.now())},800)}
function runOpening(){var q=OPENING_QUOTES[Math.floor(Math.random()*OPENING_QUOTES.length)],el=document.getElementById('opening');document.getElementById('openingQuote').textContent=q;el.addEventListener('click',dismissOpening);try{if(Date.now()-parseInt(localStorage.getItem('opening-ts')||'0')<21600000){dismissOpening();return}}catch(e){}setTimeout(dismissOpening,2900)}
function initSelect(){var sel=document.getElementById('scriptSelect');sel.innerHTML=SCRIPTS.map((s,i)=>{var m=(s.week||'').match(/Week\s*(\d+)/i),w=m?'W'+m[1]:'W'+(i+1);return `<option value="${s.id}" ${s.id===currentScriptId?'selected':''}>${w} ${esc(s.title)}</option>`}).join('')}
function getScript(){return SCRIPTS.find(s=>s.id===currentScriptId)||SCRIPTS[0]}
function switchScript(id){currentScriptId=id;localStorage.setItem('last-script',id);hlChars.clear();cueChar=rehearseChar='off';currentMode='read';document.body.className=document.body.classList.contains('dark')?'dark':'';buildScript(getScript());buildSettings(getScript());setMode('read',true);window.scrollTo(0,0)}
function buildScript(sc){document.getElementById('mainTitle').textContent=sc.title;document.getElementById('pageNum').textContent=sc.week||'';document.getElementById('scriptSelect').value=sc.id;document.body.classList.toggle('lecture-mode',sc.type==='lecture');startCountdown();var cb=document.getElementById('castBlock'),helper=document.getElementById('mastheadHelper'),mt=document.getElementById('mastheadToggle');if(sc.type==='lecture'||!sc.chars.length){cb.innerHTML=sc.author?`<div class="lec-author">撰寫人：${esc(sc.author)}</div>`:'';helper.style.display='none';mt.style.display='none'}else{helper.style.display='';mt.style.display='';cb.innerHTML=sc.chars.map(ch=>`<div class="cast-item"><span class="cast-role">${esc(ch.role)}</span><span class="cast-name">${esc(ch.name)}</span><div class="cast-quickstart"><button class="qs-btn" onclick="quickRehearse('${ch.name}')">排練</button><button class="qs-btn" onclick="quickCue('${ch.name}')">背詞</button></div></div>`).join('')}var wrap=document.getElementById('script');wrap.innerHTML='';if(sc.type==='lecture'){wrap.className='lecture-body';(sc.sections||[]).forEach(sec=>{var div=document.createElement('div');div.className='lec-section';div.innerHTML=(sec.h1?`<div class="lec-h1">${esc(sec.h1)}</div>`:'')+(sec.p||[]).map(p=>`<div class="lec-p">${esc(p)}</div>`).join('')+(sec.items||[]).map(it=>`<div class="lec-item"><span class="lec-key">${esc(it.k)}</span><span class="lec-val">${esc(it.v)}</span></div>`).join('');wrap.appendChild(div)});wrap.insertAdjacentHTML('beforeend','<div class="script-end"><span class="script-end-text">講義結束</span></div>');return}wrap.className='script-body';var n=0,prev=null;(sc.data||[]).forEach((d,i)=>{if(d.t==='s'){wrap.insertAdjacentHTML('beforeend',`<div class="sline"><span class="stxt">${esc(d.s)}</span></div>`);return}n++;var roleChange=prev&&prev!==d.c?' role-change':'';prev=d.c;var txt=esc(d.s).replace(/（([^）]+)）/g,'<span class="acting-hint">（$1）</span>');var noteId='note-'+i;var html=`<div><div class="dline${roleChange}" data-c="${esc(d.c)}"><div class="dline-main"><span class="lnum">${String(n).padStart(2,'0')}</span><span class="spkr">${esc(d.c)}</span><span class="colon">：</span><span class="dtxt">${txt}</span></div>${d.note?`<span class="note-dot" onclick="event.stopPropagation();toggleNote('${noteId}')"></span>`:''}</div>`;if(d.note)html+=`<div class="note-wrap"><div class="note-card"><button class="note-toggle" onclick="toggleNote('${noteId}')">▶ ${esc(d.note.label)}</button><div class="note-body" id="${noteId}"><div class="note-text">${d.note.text}</div></div></div></div>`;html+='</div>';wrap.insertAdjacentHTML('beforeend',html)});wrap.insertAdjacentHTML('beforeend','<div class="script-end"><div class="script-end-rule"></div><span class="script-end-text">多練一次，少忘一詞</span><div class="script-end-rule"></div></div>');document.querySelectorAll('.dline').forEach(el=>el.onclick=function(){if(currentMode==='cue'&&el.classList.contains('focus-target')){el.classList.add('cue-revealed');setTimeout(()=>el.classList.remove('cue-revealed'),2000)}})}
function buildSettings(sc){var chars=(sc.type==='lecture')?[]:sc.chars;['rehearseSelect','cueSelect'].forEach(id=>document.getElementById(id).innerHTML='<option value="off">選擇角色</option>'+chars.map(ch=>`<option value="${ch.name}">${ch.name}</option>`).join(''));document.getElementById('hlBtnGroup').innerHTML=chars.length?chars.map(ch=>`<button class="pbtn" data-hl="${ch.name}" onclick="toggleHl('${ch.name}')">${ch.name}</button>`).join(''):'<span class="row-note">講義模式不適用</span>'}
function setMode(mode,force){currentMode=mode;document.body.classList.remove('cue-mode','focus-mode','hide-action','cue-active','rehearse-active','rehearse-focus');document.querySelectorAll('.dline').forEach(l=>l.classList.remove('focus-target','rehearse-target','cue-revealed'));document.querySelectorAll('.mode-btn').forEach(b=>b.classList.toggle('on',b.dataset.mode===mode));document.body.classList.toggle('cue-active',mode==='cue');document.body.classList.toggle('rehearse-active',mode==='rehearse');if(mode!=='read')document.body.classList.add('hide-action');if(mode==='rehearse'&&rehearseChar!=='off')applyRehearseChar(rehearseChar);if(mode==='cue'&&cueChar!=='off')applyCueChar(cueChar);applyHlChars();updateFooter()}
function applyHlChars(){document.querySelectorAll('.dline').forEach(l=>l.classList.toggle('hl-on',hlChars.has(l.dataset.c)))}function toggleHl(c){hlChars.has(c)?hlChars.delete(c):hlChars.add(c);var b=document.querySelector(`[data-hl="${c}"]`);if(b)b.classList.toggle('on',hlChars.has(c));applyHlChars();updateFooter()}
function applyRehearseChar(c){if(c==='off')return;document.body.classList.add('rehearse-focus');document.querySelectorAll(`.dline[data-c="${c}"]`).forEach(l=>l.classList.add('rehearse-target'));if(!hlChars.has(c))toggleHl(c)}function setRehearseChar(v){rehearseChar=v;setMode('rehearse',true);applyRehearseChar(v)}function applyCueChar(c){document.body.classList.add('focus-mode','cue-mode');document.querySelectorAll('.dline').forEach(l=>l.classList.toggle('focus-target',l.dataset.c===c))}function setCueChar(v){cueChar=v;setMode('cue',true);if(v!=='off')applyCueChar(v);updateCueSummary()}function updateCueSummary(){var el=document.getElementById('cueSummary');if(!el)return;el.textContent=cueChar==='off'?'':`共 ${document.querySelectorAll(`.dline[data-c="${cueChar}"]`).length} 句台詞`}
function quickRehearse(c){document.getElementById('rehearseSelect').value=c;setRehearseChar(c)}function quickCue(c){document.getElementById('cueSelect').value=c;setCueChar(c)}function updateFooter(){var p=[];if(currentMode==='rehearse')p.push(rehearseChar!=='off'?'排練　'+rehearseChar:'排練模式');if(currentMode==='cue')p.push(cueChar!=='off'?'背詞　'+cueChar:'背詞模式');if(hlChars.size)p.push('螢光筆　'+Array.from(hlChars).join('·'));document.getElementById('fmode-text').textContent=p.join('　／　');document.querySelector('footer').classList.toggle('has-mode',p.length>0)}
function toggleMasthead(){var c=document.body.classList.toggle('masthead-collapsed');document.getElementById('mastheadToggle').textContent=c?'展開 ▾':'收合 ▴'}function toggleNote(id){document.getElementById(id)?.classList.toggle('open')}function toggleNotesUI(){document.body.classList.toggle('hide-notes')}function toggleExpandAllNotes(){allNotesExpanded=!allNotesExpanded;document.querySelectorAll('.note-body').forEach(b=>b.classList.toggle('open',allNotesExpanded))}function togglePanel(){document.getElementById('settingsPanel').classList.toggle('open');document.getElementById('settingsToggle').classList.toggle('on');document.getElementById('settingsOverlay').classList.toggle('open')}function changeFs(d){fs=Math.min(26,Math.max(12,fs+d*2));document.documentElement.style.setProperty('--fs',fs+'px');localStorage.setItem('fs',fs)}function toggleDark(){darkOn=!document.body.classList.contains('dark');document.body.classList.toggle('dark',darkOn);document.getElementById('darkBtn').textContent=darkOn?'晝':'夜';localStorage.setItem('dark',darkOn?'1':'0')}function closeOnboard(){document.getElementById('onboard').classList.add('hidden')}function openOnboard(){document.getElementById('onboard').classList.remove('hidden')}
var CLASS_START=new Date(2026,5,13,19,0,0).getTime(),CLASS_END=new Date(2026,5,13,21,30,0).getTime(),countdownTimer=null;function startCountdown(){var box=document.getElementById('countdownBox');if(countdownTimer)clearInterval(countdownTimer);if(currentScriptId!=='fengtan'){box.classList.remove('show');return}function pad(n){return n<10?'0'+n:n}function tick(){var now=Date.now(),t=document.getElementById('countdownTime'),l=box.querySelector('.countdown-label');box.className='countdown-box show';if(now>=CLASS_START&&now<CLASS_END){t.textContent='錄影中 · On Air';l.textContent='';box.classList.add('cd-onair');return}if(now>=CLASS_END){t.textContent='錄影已結束';l.textContent='';box.classList.add('cd-ended');clearInterval(countdownTimer);return}var diff=CLASS_START-now;if(diff<=3600000)box.classList.add('cd-red');else if(diff<=7200000)box.classList.add('cd-blue');t.textContent=pad(Math.floor(diff/3600000))+':'+pad(Math.floor(diff%3600000/60000))+':'+pad(Math.floor(diff%60000/1000))}tick();countdownTimer=setInterval(tick,1000)}
if(localStorage.getItem('dark')==='1'){document.body.classList.add('dark');document.getElementById('darkBtn').textContent='晝'}document.documentElement.style.setProperty('--fs',fs+'px');runOpening();initSelect();buildScript(getScript());buildSettings(getScript());setMode('read',true);
</script>
