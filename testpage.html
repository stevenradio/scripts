{id:'fengtan',title:'翻糖花園',week:'Week 10 · 6/13',subtitle:'表演練習',
chars:[{name:'希煥',role:'男主角'},{name:'美英',role:'閨蜜'}],
data:[
{t:'l',c:'希煥',s:'怎麼是你在做蛋糕？米恩呢？'},
{t:'l',c:'美英',s:'米恩不做蛋糕了。',note:{label:'老師筆記',text:'正在做蛋糕的樣子，但直視前方；回話時暫停手上的動作——讓觀眾感覺她不想看希煥。'}},
{t:'l',c:'希煥',s:'什麼意思？'},
{t:'l',c:'美英',s:'米恩現在連蛋糕都做不出來了！全都是因為你，這明明是她最擅長的事，可是現在因為你整天心不在焉的連蛋糕都做不好！你知道那是什麼心情嗎？'},
{t:'l',c:'美英',s:'（話說從頭）自從米恩答應她爸爸守護這間店以來，從來沒想到要休息，不管遇到什麼挫折也都沒放棄做蛋糕，就連跟顏瀚祥那傢伙分手她都還是堅持下去！',note:{label:'老師筆記',text:'說「話說從頭」時<strong>環顧四周</strong>，像在回憶這個空間。<br><br><strong>「就連」故意說兩次</strong>——重複強調，讓情緒層層疊加。<br><br><strong>抬頭看天花板</strong>，像在回憶米恩的過去，不是對著希煥說，是說給自己聽的感覺。'}},
{t:'l',c:'美英',s:'（越說越激動）可是因為你，她做的蛋糕第一次被客人嫌難吃，因為你，她第一次丟下蛋糕店，因為你，她被迫對不起她爸爸，你怎麼還有臉來找她？',note:{label:'老師筆記',text:'<strong>這一段越來越激動，要用斷句製造爆發感：</strong><br>「可是因為你（呼吸）她做的蛋糕第一次被客人嫌難吃因為你（呼吸）她第一次丟下蛋糕店因為你（呼吸）她被迫對不起她爸爸你怎麼還有臉來找她呀！」<br><br>每一個「因為你」之後都要換氣，像控訴一樣，節奏越來越快越來越緊。'}},
{t:'l',c:'希煥',s:'對不起！'},
{t:'l',c:'美英',s:'（失望）我們大家是那麼的喜歡你信任你……你簡直比顏瀚祥那傢伙還可惡，假裝是我們的朋友，卻笑嘻嘻的背叛我們！（傷心）本來還以為可以把米恩交給你……沒想到你卻……（哽咽說不下去）我廖美英真的是瞎了狗眼看錯了你！（下定決心）這一次我不會再給你機會傷害米恩（冷漠），現在請你離開。',note:{label:'老師筆記',text:'說「假裝是我們的朋友」後<strong>帶一個自嘲的笑</strong>——不是崩潰，是那種咬著牙、帶苦笑的懊悔。<br><br>「我廖美英真的是瞎了狗眼看錯了你」——<strong>結尾拉長：「你——一！」</strong>多一個音，像用力收尾，製造張力與終結感。<br><br><strong>帶咬牙切齒的感覺</strong>，像是在嘲笑自己當初太蠢，情緒是複雜的，不是單純憤怒。'}}
]}
];
var status=document.getElementById('status');
var out=document.getElementById('out');
try{
  status.textContent='SCRIPTS 載入成功，共 '+SCRIPTS.length+' 個劇本';
  var qijie=SCRIPTS.find(function(s){return s.id==='qijie';});
  if(!qijie){status.textContent='❌ 找不到 qijie';throw new Error('no qijie');}
  status.textContent='找到七個朋友，共 '+qijie.data.length+' 筆資料，開始逐筆渲染...';
  qijie.data.forEach(function(d,i){
    try{
      var div=document.createElement('div');
      div.className='line';
      if(d.t==='s'){
        div.innerHTML='<i>['+i+'] (舞台) '+d.s+'</i>';
      }else{
        var rawTxt=d.s.replace(/（([^）]+)）/g,'<span style="opacity:0.5">（$1）</span>');
        div.innerHTML='['+i+'] <b>'+d.c+'</b>：'+rawTxt;
      }
      out.appendChild(div);
    }catch(e){
      var err=document.createElement('div');
      err.className='err';
      err.textContent='❌ 第 '+i+' 筆出錯！\n'+d.c+': '+d.s+'\n錯誤: '+e.message;
      out.appendChild(err);
      status.textContent='❌ 卡在第 '+i+' 筆';
    }
  });
  if(status.textContent.indexOf('❌')<0){
    status.textContent='✅ 全部 '+qijie.data.length+' 筆都成功渲染！';
  }
}catch(e){
  status.className='err';
  status.textContent='❌ 整體錯誤: '+e.message+'\n'+(e.stack||'');
}
</script>

</html>
